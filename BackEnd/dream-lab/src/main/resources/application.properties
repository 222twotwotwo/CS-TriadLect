# ============================================================
#  application.properties —— 服务器的"出厂设置面板"
#  Spring Boot 启动时会读这个文件。以后你写的项目里，
#  数据库地址、端口号这些配置都住在这里。
# ============================================================

# 服务监听的端口。8080 就像这间实验室的门牌号，
# 浏览器访问 http://localhost:8080 就是敲这扇门。
server.port=8080

# ---- 数据库（档案馆）----
# 整个"数据库"就是项目目录下的一个文件：data/world.db
# 零安装、零配置，删掉它世界就归零。
spring.datasource.url=jdbc:sqlite:./data/world.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ddl-auto=update 的意思：每次启动时，照着 Java 实体类自动建表/补列。
# （生产环境不敢这么开，但我们的世界每天都在重建。）
spring.jpa.hibernate.ddl-auto=update

# Hibernate 认识很多种数据库，但没人告诉它 SQLite 长什么样，
# 所以我们额外请了一位"方言翻译"。
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# 关掉 Open-in-View（一个历史遗留的默认行为，关掉更符合直觉）
spring.jpa.open-in-view=false

# 前端的 html/css/js 不做强缓存：改完刷新就能看到，不用清缓存
# （玩家/你在改界面时会省下很多"为什么没生效"的困惑）
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

# 世界规则不在本文件里，它们住在项目根目录的 config/world.properties。
# （把"游戏设定"和"服务器配置"分开，是一个好习惯。）
